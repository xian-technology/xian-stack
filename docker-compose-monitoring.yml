networks:
  xian-net:
    external: false

volumes:
  xian-grafana-data:

services:
  prometheus:
    profiles: ["monitoring"]
    image: ${XIAN_PROMETHEUS_IMAGE}
    restart: always
    hostname: xian-stack-prometheus
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--web.enable-lifecycle",
      ]
    volumes:
      - ${XIAN_PROMETHEUS_CONFIG}:/etc/prometheus/prometheus.yml:ro
    networks:
      - xian-net
    ports:
      - "${XIAN_PROMETHEUS_HOST}:${XIAN_PROMETHEUS_PORT}:9090"

  grafana:
    profiles: ["monitoring"]
    image: ${XIAN_GRAFANA_IMAGE}
    restart: always
    hostname: xian-stack-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - xian-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - xian-net
    ports:
      - "${XIAN_GRAFANA_HOST}:${XIAN_GRAFANA_PORT}:3000"
