networks:
  xian-net:
    internal: false
  xian-db:
    internal: true

services:
  abci:
    environment:
      XIAN_BDS_DSN: ${XIAN_BDS_DSN}
      XIAN_BDS_HOST: ${XIAN_BDS_HOST}
      XIAN_BDS_PORT: ${XIAN_BDS_PORT}
      XIAN_BDS_DATABASE: ${XIAN_BDS_DATABASE}
      XIAN_BDS_USER: ${XIAN_BDS_USER}
      XIAN_BDS_PASSWORD: ${XIAN_BDS_PASSWORD}
      XIAN_BDS_POOL_MIN_SIZE: ${XIAN_BDS_POOL_MIN_SIZE}
      XIAN_BDS_POOL_MAX_SIZE: ${XIAN_BDS_POOL_MAX_SIZE}
      XIAN_BDS_STATEMENT_TIMEOUT_MS: ${XIAN_BDS_STATEMENT_TIMEOUT_MS}
      XIAN_BDS_ACQUIRE_TIMEOUT_MS: ${XIAN_BDS_ACQUIRE_TIMEOUT_MS}
      XIAN_BDS_APPLICATION_NAME: ${XIAN_BDS_APPLICATION_NAME}
      XIAN_BDS_QUEUE_MAX_SIZE: ${XIAN_BDS_QUEUE_MAX_SIZE}
      XIAN_BDS_CATCHUP_ENABLED: ${XIAN_BDS_CATCHUP_ENABLED}
      XIAN_BDS_CATCHUP_POLL_SECONDS: ${XIAN_BDS_CATCHUP_POLL_SECONDS}
      XIAN_BDS_RPC_URL: ${XIAN_BDS_RPC_URL}
      XIAN_BDS_SPOOL_DIR: ${XIAN_BDS_SPOOL_DIR}
      XIAN_BDS_SPOOL_WARN_ENTRIES: ${XIAN_BDS_SPOOL_WARN_ENTRIES}
      XIAN_BDS_SPOOL_WARN_BYTES: ${XIAN_BDS_SPOOL_WARN_BYTES}
      XIAN_BDS_DISK_FREE_WARN_BYTES: ${XIAN_BDS_DISK_FREE_WARN_BYTES}

  postgres:
    restart: always
    init: true
    stop_grace_period: 30s
    image: ${XIAN_POSTGRES_IMAGE:-postgres:17}
    mem_limit: ${XIAN_DOCKER_POSTGRES_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_POSTGRES_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_POSTGRES_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_POSTGRES_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_POSTGRES_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_POSTGRES_NOFILE_HARD}
    environment:
      POSTGRES_USER: ${XIAN_BDS_USER}
      POSTGRES_PASSWORD: ${XIAN_BDS_PASSWORD}
      POSTGRES_DB: ${XIAN_BDS_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${XIAN_BDS_USER} -d ${XIAN_BDS_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ${XIAN_BDS_DATA_DIR}:/var/lib/postgresql/data
    networks:
      - xian-db
    # Explicitly disable external port mapping
    expose:
      - "5432"

  postgraphile-db-init:
    restart: "no"
    init: true
    image: ${XIAN_POSTGRES_IMAGE:-postgres:17}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: ${XIAN_BDS_PORT}
      PGDATABASE: ${XIAN_BDS_DATABASE}
      PGUSER: ${XIAN_BDS_USER}
      PGPASSWORD: ${XIAN_BDS_PASSWORD}
      XIAN_BDS_USER: ${XIAN_BDS_USER}
      XIAN_POSTGRAPHILE_USER: ${XIAN_POSTGRAPHILE_USER}
      XIAN_POSTGRAPHILE_PASSWORD: ${XIAN_POSTGRAPHILE_PASSWORD}
    volumes:
      - ./docker/postgres/init-postgraphile-role.sh:/usr/local/bin/init-postgraphile-role.sh:ro
    networks:
      - xian-db
    entrypoint: ["/bin/bash", "/usr/local/bin/init-postgraphile-role.sh"]

  postgraphile:
    restart: always
    init: true
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: ./docker/postgraphile.Dockerfile  
    mem_limit: ${XIAN_DOCKER_POSTGRAPHILE_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_POSTGRAPHILE_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_POSTGRAPHILE_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_POSTGRAPHILE_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_POSTGRAPHILE_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_POSTGRAPHILE_NOFILE_HARD}
    depends_on:
      postgraphile-db-init:
        condition: service_completed_successfully
    environment:
      GRAPHILE_ENV: "production"
      POSTGRAPHILE_CONNECTION: "postgres://${XIAN_POSTGRAPHILE_USER}:${XIAN_POSTGRAPHILE_PASSWORD}@postgres:${XIAN_BDS_PORT}/${XIAN_BDS_DATABASE}"
      POSTGRAPHILE_HOST: "0.0.0.0"
      POSTGRAPHILE_PORT: "5000"
      POSTGRAPHILE_SCHEMA: "public"
      POSTGRAPHILE_RETRY_DELAY_SECONDS: "2"
    networks:
      - xian-db
      - xian-net
    ports:
      - "${XIAN_POSTGRAPHILE_HOST}:${XIAN_POSTGRAPHILE_PORT}:5000"
    command: ["/usr/src/app/start-postgraphile.sh"]
