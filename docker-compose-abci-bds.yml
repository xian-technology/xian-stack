x-logging: &x-logging
  driver: local
  options:
    max-size: "${XIAN_DOCKER_LOG_MAX_FILE_MB:-50}m"
    max-file: "${XIAN_DOCKER_LOG_MAX_FILES:-5}"
    mode: blocking

networks:
  xian-net:
    internal: false
  xian-db:
    internal: true

# The one copy of the BDS password: an owner-only host file
# (stack_credentials.py creates it; default .stack-bds-password) that Postgres
# and the node both read.
secrets:
  xian_bds_password:
    file: ${XIAN_BDS_PASSWORD_FILE:?XIAN_BDS_PASSWORD_FILE must name the BDS password file; run through make or scripts/backend.py}

services:
  abci:
    logging: *x-logging
    # The node reads every BDS setting from xian.toml [bds] and the password
    # from this secret (bds.password_file = /run/secrets/xian_bds_password).
    secrets:
      - xian_bds_password

  postgres:
    logging: *x-logging
    restart: always
    init: true
    stop_grace_period: 30s
    image: ${XIAN_POSTGRES_IMAGE:-postgres:18.7}
    mem_limit: ${XIAN_DOCKER_POSTGRES_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_POSTGRES_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_POSTGRES_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_POSTGRES_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_POSTGRES_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_POSTGRES_NOFILE_HARD}
    # Postgres' own init settings; they match the node's [bds] defaults.
    environment:
      POSTGRES_USER: xian
      POSTGRES_PASSWORD_FILE: /run/secrets/xian_bds_password
      POSTGRES_DB: xian
    secrets:
      - xian_bds_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xian -d xian"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ${XIAN_BDS_DATA_DIR}:/var/lib/postgresql
    networks:
      - xian-db
    # Explicitly disable external port mapping
    expose:
      - "5432"

  postgraphile-db-init:
    logging: *x-logging
    restart: "no"
    init: true
    image: ${XIAN_POSTGRES_IMAGE:-postgres:18.7}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: xian
      PGUSER: xian
      XIAN_BDS_PASSWORD_FILE: /run/secrets/xian_bds_password
      XIAN_POSTGRAPHILE_USER: ${XIAN_POSTGRAPHILE_USER}
      XIAN_POSTGRAPHILE_PASSWORD: ${XIAN_POSTGRAPHILE_PASSWORD}
      XIAN_POSTGRAPHILE_STATEMENT_TIMEOUT_MS: ${XIAN_POSTGRAPHILE_STATEMENT_TIMEOUT_MS}
    volumes:
      - ./docker/postgres/init-postgraphile-role.sh:/usr/local/bin/init-postgraphile-role.sh:ro
    networks:
      - xian-db
    secrets:
      - xian_bds_password
    entrypoint: ["/bin/bash", "/usr/local/bin/init-postgraphile-role.sh"]

  postgraphile:
    logging: *x-logging
    restart: always
    init: true
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: ./docker/postgraphile.Dockerfile  
    mem_limit: ${XIAN_DOCKER_POSTGRAPHILE_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_POSTGRAPHILE_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_POSTGRAPHILE_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_POSTGRAPHILE_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_POSTGRAPHILE_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_POSTGRAPHILE_NOFILE_HARD}
    depends_on:
      postgraphile-db-init:
        condition: service_completed_successfully
    environment:
      GRAPHILE_ENV: "production"
      PGUSER: ${XIAN_POSTGRAPHILE_USER}
      PGPASSWORD: ${XIAN_POSTGRAPHILE_PASSWORD}
      PGPORT: "5432"
      PGDATABASE: xian
      POSTGRAPHILE_HOST: "0.0.0.0"
      POSTGRAPHILE_PORT: "5000"
      POSTGRAPHILE_SCHEMA: "public"
      POSTGRAPHILE_RETRY_DELAY_SECONDS: "2"
      POSTGRAPHILE_BODY_SIZE_LIMIT_BYTES: ${XIAN_POSTGRAPHILE_BODY_SIZE_LIMIT_BYTES}
      POSTGRAPHILE_ENFORCE_QUERY_LIMITS: ${XIAN_PUBLIC_QUERY_ENABLED:-0}
      POSTGRAPHILE_DISABLE_DEFAULT_MUTATIONS: ${XIAN_POSTGRAPHILE_DISABLE_DEFAULT_MUTATIONS}
      POSTGRAPHILE_SIMPLE_COLLECTIONS: ${XIAN_POSTGRAPHILE_SIMPLE_COLLECTIONS}
      POSTGRAPHILE_SCHEMA_WAIT_TIMEOUT_SECONDS: ${XIAN_POSTGRAPHILE_SCHEMA_WAIT_TIMEOUT_SECONDS}
      POSTGRAPHILE_REQUIRED_TABLES: ${XIAN_POSTGRAPHILE_REQUIRED_TABLES}
    networks:
      - xian-db
      - xian-net
    ports:
      - target: 5000
        published: "${XIAN_POSTGRAPHILE_PORT}"
        host_ip: "${XIAN_POSTGRAPHILE_HOST}"
        protocol: tcp
    command: ["/usr/src/app/start-postgraphile.sh"]
