name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      xian_abci_repository: ${{ steps.resolve.outputs.xian_abci_repository }}
      xian_abci_ref: ${{ steps.resolve.outputs.xian_abci_ref }}
      xian_configs_repository: ${{ steps.resolve.outputs.xian_configs_repository }}
      xian_configs_ref: ${{ steps.resolve.outputs.xian_configs_ref }}
      xian_contracting_repository: ${{ steps.resolve.outputs.xian_contracting_repository }}
      xian_contracting_ref: ${{ steps.resolve.outputs.xian_contracting_ref }}
      xian_py_repository: ${{ steps.resolve.outputs.xian_py_repository }}
      xian_py_ref: ${{ steps.resolve.outputs.xian_py_ref }}
      xian_stable_protocol_repository: ${{ steps.resolve.outputs.xian_stable_protocol_repository }}
      xian_stable_protocol_ref: ${{ steps.resolve.outputs.xian_stable_protocol_ref }}
      python_image: ${{ steps.resolve.outputs.python_image }}
      go_image: ${{ steps.resolve.outputs.go_image }}
      rust_image: ${{ steps.resolve.outputs.rust_image }}
      uv_image: ${{ steps.resolve.outputs.uv_image }}
      debian_snapshot: ${{ steps.resolve.outputs.debian_snapshot }}
      source_date_epoch: ${{ steps.resolve.outputs.source_date_epoch }}
      pip_version: ${{ steps.resolve.outputs.pip_version }}
      packaging_version: ${{ steps.resolve.outputs.packaging_version }}
      wheel_version: ${{ steps.resolve.outputs.wheel_version }}
      maturin_version: ${{ steps.resolve.outputs.maturin_version }}
      cometbft_version: ${{ steps.resolve.outputs.cometbft_version }}
      cometbft_source_url: ${{ steps.resolve.outputs.cometbft_source_url }}
      cometbft_source_sha256: ${{ steps.resolve.outputs.cometbft_source_sha256 }}
      s6_overlay_version: ${{ steps.resolve.outputs.s6_overlay_version }}
      s6_overlay_noarch_sha256: ${{ steps.resolve.outputs.s6_overlay_noarch_sha256 }}
      s6_overlay_x86_64_sha256: ${{ steps.resolve.outputs.s6_overlay_x86_64_sha256 }}
      s6_overlay_aarch64_sha256: ${{ steps.resolve.outputs.s6_overlay_aarch64_sha256 }}
      integrated_image_name: ${{ steps.resolve.outputs.integrated_image_name }}
      split_image_name: ${{ steps.resolve.outputs.split_image_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate release manifest
        run: python ./scripts/release_manifest.py validate

      - name: Export release manifest outputs
        id: resolve
        run: python ./scripts/release_manifest.py github-output --github-output "${GITHUB_OUTPUT}"

  release-safety:
    needs: release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v6
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_abci_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_abci_ref }}
          path: xian-abci

      - name: Check out xian-configs
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_configs_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_configs_ref }}
          path: xian-configs

      - name: Check out xian-contracting
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_contracting_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_contracting_ref }}
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_py_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_py_ref }}
          path: xian-py

      - name: Check out xian-stable-protocol
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_stable_protocol_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_stable_protocol_ref }}
          path: xian-stable-protocol

      - name: Check out xian-cli
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-cli
          ref: main
          path: xian-cli

      - name: Check out xian-contracts
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracts
          ref: main
          path: xian-contracts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Ensure Rust toolchain is available
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi
          cargo --version

      - name: Install shared compiler tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
          wasm-pack --version

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libhdf5-dev build-essential

      - name: Run release safety gate
        working-directory: xian-stack
        run: ./scripts/release-safety.sh

      - name: Upload localnet safety artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xian-stack-release-safety-artifacts
          path: |
            xian-stack/.artifacts/localnet-e2e
            xian-stack/.artifacts/localnet-protocol-safety
            xian-stack/.localnet/network.json
          if-no-files-found: warn

  publish-images:
    needs:
      - release-manifest
      - release-safety
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v6
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_abci_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_abci_ref }}
          path: xian-abci

      - name: Check out xian-configs
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_configs_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_configs_ref }}
          path: xian-configs

      - name: Check out xian-contracting
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_contracting_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_contracting_ref }}
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_py_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_py_ref }}
          path: xian-py

      - name: Normalize registry owner
        id: registry
        run: echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Generate integrated image metadata
        id: meta-integrated
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ needs.release-manifest.outputs.integrated_image_name }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Xian Node
            org.opencontainers.image.description=Integrated Xian node image with CometBFT and xian-abci
            io.xian.release.manifest-sha=${{ hashFiles('xian-stack/release-manifest.json') }}

      - name: Generate split image metadata
        id: meta-split
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ needs.release-manifest.outputs.split_image_name }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Xian Node Split Runtime
            org.opencontainers.image.description=Split Xian runtime image for ABCI, CometBFT, and dashboard services
            io.xian.release.manifest-sha=${{ hashFiles('xian-stack/release-manifest.json') }}

      - name: Build and publish integrated image
        id: build-integrated
        uses: docker/build-push-action@v7
        with:
          context: ./xian-stack
          file: ./xian-stack/docker/xian-node.Dockerfile
          target: integrated
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta-integrated.outputs.tags }}
          labels: ${{ steps.meta-integrated.outputs.labels }}
          build-contexts: |
            xian-abci=./xian-abci
            xian-configs=./xian-configs
            xian-contracting=./xian-contracting
            xian-py=./xian-py
          build-args: |
            PYTHON_IMAGE=${{ needs.release-manifest.outputs.python_image }}
            GO_IMAGE=${{ needs.release-manifest.outputs.go_image }}
            RUST_IMAGE=${{ needs.release-manifest.outputs.rust_image }}
            UV_IMAGE=${{ needs.release-manifest.outputs.uv_image }}
            DEBIAN_SNAPSHOT=${{ needs.release-manifest.outputs.debian_snapshot }}
            SOURCE_DATE_EPOCH=${{ needs.release-manifest.outputs.source_date_epoch }}
            PIP_VERSION=${{ needs.release-manifest.outputs.pip_version }}
            PACKAGING_VERSION=${{ needs.release-manifest.outputs.packaging_version }}
            WHEEL_VERSION=${{ needs.release-manifest.outputs.wheel_version }}
            MATURIN_VERSION=${{ needs.release-manifest.outputs.maturin_version }}
            COMETBFT_VERSION=${{ needs.release-manifest.outputs.cometbft_version }}
            COMETBFT_SOURCE_URL=${{ needs.release-manifest.outputs.cometbft_source_url }}
            COMETBFT_SOURCE_SHA256=${{ needs.release-manifest.outputs.cometbft_source_sha256 }}
            S6_OVERLAY_VERSION=${{ needs.release-manifest.outputs.s6_overlay_version }}
            S6_OVERLAY_NOARCH_SHA256=${{ needs.release-manifest.outputs.s6_overlay_noarch_sha256 }}
            S6_OVERLAY_X86_64_SHA256=${{ needs.release-manifest.outputs.s6_overlay_x86_64_sha256 }}
            S6_OVERLAY_AARCH64_SHA256=${{ needs.release-manifest.outputs.s6_overlay_aarch64_sha256 }}

      - name: Build and publish split image
        id: build-split
        uses: docker/build-push-action@v7
        with:
          context: ./xian-stack
          file: ./xian-stack/docker/xian-node.Dockerfile
          target: split
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta-split.outputs.tags }}
          labels: ${{ steps.meta-split.outputs.labels }}
          build-contexts: |
            xian-abci=./xian-abci
            xian-configs=./xian-configs
            xian-contracting=./xian-contracting
            xian-py=./xian-py
          build-args: |
            PYTHON_IMAGE=${{ needs.release-manifest.outputs.python_image }}
            GO_IMAGE=${{ needs.release-manifest.outputs.go_image }}
            RUST_IMAGE=${{ needs.release-manifest.outputs.rust_image }}
            UV_IMAGE=${{ needs.release-manifest.outputs.uv_image }}
            DEBIAN_SNAPSHOT=${{ needs.release-manifest.outputs.debian_snapshot }}
            SOURCE_DATE_EPOCH=${{ needs.release-manifest.outputs.source_date_epoch }}
            PIP_VERSION=${{ needs.release-manifest.outputs.pip_version }}
            PACKAGING_VERSION=${{ needs.release-manifest.outputs.packaging_version }}
            WHEEL_VERSION=${{ needs.release-manifest.outputs.wheel_version }}
            MATURIN_VERSION=${{ needs.release-manifest.outputs.maturin_version }}
            COMETBFT_VERSION=${{ needs.release-manifest.outputs.cometbft_version }}
            COMETBFT_SOURCE_URL=${{ needs.release-manifest.outputs.cometbft_source_url }}
            COMETBFT_SOURCE_SHA256=${{ needs.release-manifest.outputs.cometbft_source_sha256 }}
            S6_OVERLAY_VERSION=${{ needs.release-manifest.outputs.s6_overlay_version }}
            S6_OVERLAY_NOARCH_SHA256=${{ needs.release-manifest.outputs.s6_overlay_noarch_sha256 }}
            S6_OVERLAY_X86_64_SHA256=${{ needs.release-manifest.outputs.s6_overlay_x86_64_sha256 }}
            S6_OVERLAY_AARCH64_SHA256=${{ needs.release-manifest.outputs.s6_overlay_aarch64_sha256 }}

      - name: Sign integrated image
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/${{ needs.release-manifest.outputs.integrated_image_name }}@${{ steps.build-integrated.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if cosign sign --yes "$IMAGE_REF"; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "failed to sign $IMAGE_REF after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Sign split image
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ghcr.io/${{ steps.registry.outputs.owner }}/${{ needs.release-manifest.outputs.split_image_name }}@${{ steps.build-split.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if cosign sign --yes "$IMAGE_REF"; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "failed to sign $IMAGE_REF after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Stage release assets
        run: |
          mkdir -p /tmp/release-assets
          cp xian-stack/release-manifest.json /tmp/release-assets/
          cat > /tmp/release-assets/image-release.txt <<EOF
          integrated_image=ghcr.io/${{ steps.registry.outputs.owner }}/${{ needs.release-manifest.outputs.integrated_image_name }}:${GITHUB_REF_NAME#v}
          integrated_digest=${{ steps.build-integrated.outputs.digest }}
          split_image=ghcr.io/${{ steps.registry.outputs.owner }}/${{ needs.release-manifest.outputs.split_image_name }}:${GITHUB_REF_NAME#v}
          split_digest=${{ steps.build-split.outputs.digest }}
          xian_abci_ref=${{ needs.release-manifest.outputs.xian_abci_ref }}
          xian_configs_ref=${{ needs.release-manifest.outputs.xian_configs_ref }}
          xian_contracting_ref=${{ needs.release-manifest.outputs.xian_contracting_ref }}
          xian_py_ref=${{ needs.release-manifest.outputs.xian_py_ref }}
          xian_stable_protocol_ref=${{ needs.release-manifest.outputs.xian_stable_protocol_ref }}
          EOF
          export XIAN_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def inspect_platform_digests(ref: str) -> dict[str, str]:
              output = subprocess.run(
                  [
                      "docker",
                      "buildx",
                      "imagetools",
                      "inspect",
                      "--format",
                      "{{json .Manifest}}",
                      ref,
                  ],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout
              payload = json.loads(output)
              platform_digests = {}
              for manifest in payload.get("manifests", []):
                  platform = manifest.get("platform") or {}
                  os_name = platform.get("os")
                  architecture = platform.get("architecture")
                  if os_name != "linux" or architecture not in {"amd64", "arm64"}:
                      continue
                  platform_key = f"{os_name}/{architecture}"
                  platform_digests[platform_key] = manifest["digest"]
              return platform_digests

          owner = "${{ steps.registry.outputs.owner }}"
          version = os.environ["XIAN_RELEASE_VERSION"]
          images = {
              "integrated": {
                  "repository": f"ghcr.io/{owner}/${{ needs.release-manifest.outputs.integrated_image_name }}",
                  "digest": "${{ steps.build-integrated.outputs.digest }}",
              },
              "split": {
                  "repository": f"ghcr.io/{owner}/${{ needs.release-manifest.outputs.split_image_name }}",
                  "digest": "${{ steps.build-split.outputs.digest }}",
              },
          }
          release_json = {"schema_version": 1, "version": version, "images": {}}
          image_labels = {
              "integrated": [label for label in """${{ steps.meta-integrated.outputs.labels }}""".splitlines() if label],
              "split": [label for label in """${{ steps.meta-split.outputs.labels }}""".splitlines() if label],
          }
          for name, image in images.items():
              ref = f"{image['repository']}@{image['digest']}"
              release_json["images"][name] = {
                  "repository": image["repository"],
                  "version_ref": f"{image['repository']}:{version}",
                  "digest": image["digest"],
                  "labels": image_labels[name],
                  "platform_digests": inspect_platform_digests(ref),
              }
          Path("/tmp/release-assets/image-release.json").write_text(
              json.dumps(release_json, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Sign release assets
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for asset in /tmp/release-assets/*; do
            cosign sign-blob --yes \
              --bundle "${asset}.sigstore.json" \
              "${asset}"
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: /tmp/release-assets/*
          if-no-files-found: error
          retention-days: 14

  verify-reproducibility:
    needs:
      - release-manifest
      - publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v6
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_abci_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_abci_ref }}
          path: xian-abci

      - name: Check out xian-configs
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_configs_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_configs_ref }}
          path: xian-configs

      - name: Check out xian-contracting
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_contracting_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_contracting_ref }}
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.release-manifest.outputs.xian_py_repository }}
          ref: ${{ needs.release-manifest.outputs.xian_py_ref }}
          path: xian-py

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: release-assets

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify release reproducibility
        run: |
          python xian-stack/scripts/verify_release_reproducibility.py \
            --manifest xian-stack/release-manifest.json \
            --image-release release-assets/image-release.json \
            --workspace-root "${GITHUB_WORKSPACE}"

  github-release:
    needs:
      - release-manifest
      - publish-images
      - verify-reproducibility
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "xian-stack ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            ${prerelease_flag}
