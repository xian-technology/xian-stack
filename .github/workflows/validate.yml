name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-abci
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Check out xian-cli
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-cli
          path: xian-cli

      # The DEX automation backend tests run against the sibling repo.
      - name: Check out xian-dex-automation
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-dex-automation
          path: xian-dex-automation

      - name: Use matching dependency branches when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for repo in xian-abci xian-contracting xian-py xian-configs xian-cli xian-dex-automation; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$BRANCH"
              git -C "$repo" checkout -B "$BRANCH" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        working-directory: xian-stack
        run: uv sync --locked --group dev

      # The backend reads credential metadata through the service's own environment.
      - name: Sync the DEX automation service environment
        working-directory: xian-dex-automation
        run: uv sync --locked

      - name: Ruff lint
        working-directory: xian-stack
        run: uv run --locked ruff check .

      - name: Ruff format check
        working-directory: xian-stack
        run: uv run --locked ruff format --check .

      - name: Run tests
        working-directory: xian-stack
        run: uv run --locked pytest -q

      - name: Validate stack
        working-directory: xian-stack
        run: ./scripts/validate-stack.sh

  smoke:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-abci
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Check out xian-cli
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-cli
          path: xian-cli

      - name: Use matching dependency branches when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for repo in xian-abci xian-contracting xian-py xian-configs xian-cli; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$BRANCH"
              git -C "$repo" checkout -B "$BRANCH" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run stack smoke test
        working-directory: xian-stack
        run: ./scripts/smoke-stack.sh
