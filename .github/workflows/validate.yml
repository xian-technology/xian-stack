name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          path: xian-stack

      # Maintenance CI must exercise the same immutable inputs as publication.
      - name: Check out pinned release dependencies
        uses: ./xian-stack/.github/actions/checkout-localnet
        with:
          products: 'true'

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        working-directory: xian-stack
        run: uv sync --locked --group dev

      # The backend reads credential metadata through the service's own environment.
      - name: Sync the DEX automation service environment
        working-directory: xian-dex-automation
        run: uv sync --locked

      - name: Ruff lint
        working-directory: xian-stack
        run: uv run --locked ruff check .

      - name: Ruff format check
        working-directory: xian-stack
        run: uv run --locked ruff format --check .

      - name: Run tests
        working-directory: xian-stack
        run: uv run --locked pytest -q

      - name: Validate stack
        working-directory: xian-stack
        run: ./scripts/validate-stack.sh

  smoke:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          path: xian-stack

      # Maintenance CI must exercise the same immutable inputs as publication.
      - name: Check out pinned release dependencies
        uses: ./xian-stack/.github/actions/checkout-localnet
        with:
          products: 'true'

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run stack smoke test
        working-directory: xian-stack
        run: ./scripts/smoke-stack.sh
