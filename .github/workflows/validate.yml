name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v6
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-abci
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Check out xian-cli
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-cli
          path: xian-cli

      - name: Use matching dependency branches when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.ref_name }}"
          for repo in xian-abci xian-contracting xian-py xian-configs xian-cli; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$BRANCH"
              git -C "$repo" checkout -B "$BRANCH" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Validate stack
        working-directory: xian-stack
        run: ./scripts/validate-stack.sh

  smoke:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v6
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-abci
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Check out xian-cli
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-cli
          path: xian-cli

      - name: Use matching dependency branches when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.ref_name }}"
          for repo in xian-abci xian-contracting xian-py xian-configs xian-cli; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$BRANCH"
              git -C "$repo" checkout -B "$BRANCH" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run stack smoke test
        working-directory: xian-stack
        run: ./scripts/smoke-stack.sh

  validator-governance-localnet:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v6
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-abci
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Check out xian-cli
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-cli
          path: xian-cli

      - name: Use matching dependency branches when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.ref_name }}"
          for repo in xian-abci xian-contracting xian-py xian-configs xian-cli; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$BRANCH"
              git -C "$repo" checkout -B "$BRANCH" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run validator governance localnet
        working-directory: xian-stack
        env:
          LOCALNET_VALIDATOR_GOVERNANCE_BUILD: "1"
        run: make localnet-validator-governance

  release-safety-localnet:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v6
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-abci
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Check out xian-cli
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-cli
          path: xian-cli

      - name: Check out xian-contracts
        uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-contracts
          path: xian-contracts

      - name: Use matching dependency branches when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.ref_name }}"
          for repo in xian-abci xian-contracting xian-py xian-configs xian-cli xian-contracts; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$BRANCH"
              git -C "$repo" checkout -B "$BRANCH" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run release safety localnet
        working-directory: xian-stack
        run: ./scripts/release-safety.sh --skip-repo-validation

      - name: Upload localnet safety artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xian-stack-release-safety-localnet
          path: |
            xian-stack/.artifacts/localnet-e2e
            xian-stack/.artifacts/localnet-validator-governance
            xian-stack/.localnet/network.json
          if-no-files-found: warn
