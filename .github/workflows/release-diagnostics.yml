name: Diagnose or recover published images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable published stack tag
        required: true
        default: v0.3.8
        type: string
      source_run_id:
        description: Original release run containing release-assets
        required: true
        default: '44711736245'
        type: string
      finalize_release:
        description: Verify all published image variants and finish the GitHub release
        required: true
        default: false
        type: boolean

concurrency:
  group: published-release-recovery-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out diagnostic tools
        uses: actions/checkout@v7
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Authenticate the original source selection
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag, run_id = os.environ['RELEASE_TAG'], os.environ['SOURCE_RUN_ID']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'invalid release tag'
          assert run_id.isdecimal() and int(run_id) > 0, 'invalid release run'
          sha = subprocess.check_output(['git', '-C', 'tooling', 'rev-parse',
                                        '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          run = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert run['head_sha'] == sha and run['head_branch'] == tag, 'source mismatch'
          assert run['path'] == '.github/workflows/release.yml', 'not a release run'
          assert run['event'] == 'push' and run['status'] == 'completed', 'release still active'
          jobs = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}/jobs?per_page=100']))
          results = {job['name']: job['conclusion'] for job in jobs['jobs']}
          for required in ('release-manifest', 'release-safety', 'publish-images'):
              assert results.get(required) == 'success', f'{required} did not pass'
          Path('selected-run.json').write_text(json.dumps(run, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
          PY

      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.selected.outputs.sha }}
          path: xian-stack

      - name: Check out frozen release dependencies
        uses: ./xian-stack/.github/actions/checkout-localnet

      - name: Download original signed release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Check metadata against the immutable source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.selected.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          read = lambda p: json.loads(Path(p).read_text())
          assert read('release-assets/release-manifest.json') == read('xian-stack/release-manifest.json')
          release = read('release-assets/image-release.json')
          assert release['version'] == os.environ['RELEASE_TAG'][1:], 'version mismatch'
          for image in release['images'].values():
              assert f'org.opencontainers.image.revision={os.environ["SOURCE_SHA"]}' in image['labels']
          PY

      - name: Set up original build engine
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Restore recorded Rust wheel dependencies
        run: |
          python tooling/scripts/release_rust_inputs.py \
            --manifest xian-stack/release-manifest.json \
            --contracting-root xian-contracting > rust-inputs.json

      - name: Set up QEMU
        if: inputs.finalize_release
        uses: docker/setup-qemu-action@v4

      - name: Rebuild and diagnose without publishing
        if: '!inputs.finalize_release'
        run: |
          python tooling/scripts/release_layer_diagnostics.py \
            --manifest xian-stack/release-manifest.json \
            --image-release release-assets/image-release.json \
            --workspace-root "$GITHUB_WORKSPACE" \
            --output-dir diagnostics

      - name: Verify the published image variants and monitoring bundle
        if: inputs.finalize_release
        run: |
          if [[ -f xian-stack/scripts/package_monitoring.py ]]; then
            python xian-stack/scripts/package_monitoring.py "${RUNNER_TEMP}/rebuilt-monitoring"
            for asset in xian-monitoring.tar xian-monitoring.tar.sha256; do
              cmp "release-assets/${asset}" "${RUNNER_TEMP}/rebuilt-monitoring/${asset}"
            done
          fi
          python tooling/scripts/verify_release_reproducibility.py \
            --manifest xian-stack/release-manifest.json \
            --image-release release-assets/image-release.json \
            --workspace-root "$GITHUB_WORKSPACE" > reproducibility.json
          cat reproducibility.json

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-layer-diagnostics
          path: |
            diagnostics
            selected-run.json
            rust-inputs.json
            reproducibility.json
          if-no-files-found: warn

  finalize:
    if: inputs.finalize_release
    needs: diagnose
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out recovery tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Download original signed release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Download successful recovery evidence
        uses: actions/download-artifact@v8
        with:
          name: release-layer-diagnostics
          path: recovery

      - name: Finish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PYTHONPATH: tooling/scripts
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from verify_release_reproducibility import expected_release_digests, load_json

          proof = load_json(Path('recovery/reproducibility.json'))
          manifest = load_json(Path('release-assets/release-manifest.json'))
          release = load_json(Path('release-assets/image-release.json'))
          expected = {
              f'{target}:{platform}': digest
              for (target, platform), digest in expected_release_digests(manifest, release).items()
          }
          verified = {
              variant: result['expected_manifest_digest']
              for variant, result in proof['observed'].items()
          }
          if proof['ok'] is not True or verified != expected:
              raise SystemExit('recovery proof does not cover all published image variants')
          Path('recovery/recovery-notes.txt').write_text(
              'Recovered verification of the original published images. No images were republished.\n'
              f'Workflow: {os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n'
              f'Tooling source: {os.environ["GITHUB_SHA"]}\n')
          PY
          gh release create "$RELEASE_TAG" release-assets/* \
            recovery/reproducibility.json recovery/rust-inputs.json recovery/recovery-notes.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "xian-stack ${RELEASE_TAG#v}" --generate-notes
