name: Localnet Safety

on:
  workflow_dispatch:
    inputs:
      replay_run_id:
        description: 'Optional prior Localnet Safety run ID: replay its exact corpus without creating a new network'
        required: false
        type: string
      replay_corpus_ref:
        description: 'Optional immutable 40-hex evidence Git commit containing encrypted corpus only'
        required: false
        type: string
      replay_archive_sha256:
        description: 'Required ciphertext archive SHA256 when replay_corpus_ref is set'
        required: false
        type: string
      replay_manifest_sha256:
        description: 'Required public manifest SHA256 when replay_corpus_ref is set'
        required: false
        type: string
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: xian-stack-network-safety
  cancel-in-progress: false

jobs:
  import-replay-corpus:
    if: ${{ inputs.replay_corpus_ref || inputs.replay_archive_sha256 || inputs.replay_manifest_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out reviewed workflow tools
        uses: actions/checkout@v7
        with:
          path: xian-stack
          persist-credentials: false
      - name: Validate the replay-only selection before checking out data
        env:
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
          REPLAY_CORPUS_REF: ${{ inputs.replay_corpus_ref }}
          REPLAY_ARCHIVE_SHA256: ${{ inputs.replay_archive_sha256 }}
          REPLAY_MANIFEST_SHA256: ${{ inputs.replay_manifest_sha256 }}
        run: python3 xian-stack/scripts/replay_corpus_bridge.py validate-inputs
      - name: Check out only the immutable encrypted evidence commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.replay_corpus_ref }}
          path: incoming-corpus
          persist-credentials: false
      - name: Validate and import ciphertext only
        env:
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
          REPLAY_CORPUS_REF: ${{ inputs.replay_corpus_ref }}
          REPLAY_ARCHIVE_SHA256: ${{ inputs.replay_archive_sha256 }}
          REPLAY_MANIFEST_SHA256: ${{ inputs.replay_manifest_sha256 }}
        run: >-
          python3 xian-stack/scripts/replay_corpus_bridge.py import
          --input incoming-corpus --output corpus
          --proof-output replay-import-proof.json
      - name: Upload the authenticated encrypted corpus
        uses: actions/upload-artifact@v7
        with:
          name: xian-stack-replay-corpus
          path: corpus/
          if-no-files-found: error
      - name: Upload public import provenance
        uses: actions/upload-artifact@v7
        with:
          name: replay-import-proof
          path: replay-import-proof.json
          if-no-files-found: error

  protocol-safety-localnet:
    if: ${{ !inputs.replay_run_id && !inputs.replay_corpus_ref && !inputs.replay_archive_sha256 && !inputs.replay_manifest_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          path: xian-stack

      - name: Check out pinned localnet dependencies
        uses: ./xian-stack/.github/actions/checkout-localnet

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run protocol safety localnet
        working-directory: xian-stack
        env:
          LOCALNET_PROTOCOL_SAFETY_BUILD: "1"
        run: make localnet-protocol-safety

      - name: Export public protocol proof
        if: always()
        working-directory: xian-stack
        run: >-
          python3 scripts/export_localnet_public_proof.py --kind protocol
          --input .artifacts/localnet-protocol-safety
          --output .artifacts/public-localnet-protocol
          --network .localnet/network.json

      - name: Upload protocol safety artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xian-stack-protocol-safety-localnet
          path: xian-stack/.artifacts/public-localnet-protocol
          if-no-files-found: warn

  release-safety-localnet:
    needs: protocol-safety-localnet
    if: ${{ !inputs.replay_run_id && !inputs.replay_corpus_ref && !inputs.replay_archive_sha256 && !inputs.replay_manifest_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          path: xian-stack

      - name: Check out pinned localnet dependencies
        uses: ./xian-stack/.github/actions/checkout-localnet
        with:
          products: 'true'

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run release safety localnet
        working-directory: xian-stack
        run: ./scripts/release-safety.sh --skip-repo-validation --skip-protocol-safety

      - name: Export public localnet proof
        if: always()
        working-directory: xian-stack
        run: >-
          python3 scripts/export_localnet_public_proof.py --kind e2e
          --input .artifacts/localnet-e2e
          --output .artifacts/public-localnet-e2e
          --network .localnet/network.json

      - name: Upload localnet safety artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xian-stack-release-safety-localnet
          path: xian-stack/.artifacts/public-localnet-e2e
          if-no-files-found: warn

      - name: Upload corpus for native architecture replay
        uses: actions/upload-artifact@v7
        with:
          name: xian-stack-replay-corpus
          include-hidden-files: true
          path: xian-stack/.artifacts/localnet-e2e/*/replay-corpus/
          if-no-files-found: error

  replay-architecture:
    name: Replay corpus (${{ matrix.runner }})
    needs: [release-safety-localnet, import-replay-corpus]
    if: ${{ always() && !cancelled() && (needs.release-safety-localnet.result == 'success' || (inputs.replay_run_id != '' && !inputs.replay_corpus_ref && !inputs.replay_archive_sha256 && !inputs.replay_manifest_sha256) || needs.import-replay-corpus.result == 'success') }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Validate the source workflow run
        env:
          SOURCE_RUN_ID: ${{ inputs.replay_run_id || github.run_id }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['SOURCE_RUN_ID']), 'invalid source run ID'
          PYCODE
      - name: Download the same source-network corpus
        uses: actions/download-artifact@v8
        with:
          name: xian-stack-replay-corpus
          path: corpus
          run-id: ${{ inputs.replay_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Read exact source revisions
        id: corpus
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          manifests = list(Path('corpus').rglob('manifest.json'))
          assert len(manifests) == 1, manifests
          manifest = json.loads(manifests[0].read_text())
          assert not manifest.get('dirty_repositories'), 'CI replay requires committed source revisions'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('path=' + str(manifests[0].parent.resolve()), file=output)
              for repo, sha in manifest['repositories'].items():
                  assert re.fullmatch(r'[0-9a-f]{40}', sha), (repo, sha)
                  print(repo.replace('-', '_') + '=' + sha, file=output)
          PY

      - uses: actions/checkout@v7
        with:
          path: xian-stack
          ref: ${{ steps.corpus.outputs.xian_stack }}
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-abci
          path: xian-abci
          ref: ${{ steps.corpus.outputs.xian_abci }}
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting
          ref: ${{ steps.corpus.outputs.xian_contracting }}
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-py
          path: xian-py
          ref: ${{ steps.corpus.outputs.xian_py }}
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          path: xian-configs
          ref: ${{ steps.corpus.outputs.xian_configs }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Build a native node from the recorded revisions
        run: |
          docker buildx build --load --target integrated \
            --build-context xian-abci=./xian-abci \
            --build-context xian-contracting=./xian-contracting \
            --build-context xian-py=./xian-py \
            --build-context xian-configs=./xian-configs \
            --tag xian-replay:local --file xian-stack/docker/xian-node.Dockerfile xian-stack
      - name: Check out the trusted transport helper from this workflow revision
        if: ${{ inputs.replay_corpus_ref }}
        uses: actions/checkout@v7
        with:
          path: workflow-tools
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned authenticated decryption dependency
        if: ${{ inputs.replay_corpus_ref }}
        run: python -m pip install PyNaCl==1.6.2
      - name: Decrypt privately with the scoped temporary test key
        if: ${{ inputs.replay_corpus_ref }}
        env:
          INPUT_CORPUS: ${{ steps.corpus.outputs.path }}
          PRIVATE_CORPUS: ${{ runner.temp }}/xian-replay-private
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
          REPLAY_CORPUS_REF: ${{ inputs.replay_corpus_ref }}
          REPLAY_ARCHIVE_SHA256: ${{ inputs.replay_archive_sha256 }}
          REPLAY_MANIFEST_SHA256: ${{ inputs.replay_manifest_sha256 }}
          REPLAY_TRANSPORT_KEY: ${{ secrets.XIAN_REPLAY_CORPUS_TEST_KEY }}
        run: >-
          python3 workflow-tools/scripts/replay_corpus_bridge.py decrypt
          --input "$INPUT_CORPUS" --output "$PRIVATE_CORPUS"
          --proof-output "$GITHUB_WORKSPACE/replay-transport-proof.json"
      - name: Re-execute every source block and compare outcomes
        working-directory: xian-stack
        env:
          XIAN_REPLAY_CORPUS: ${{ inputs.replay_corpus_ref && format('{0}/xian-replay-private', runner.temp) || steps.corpus.outputs.path }}
        run: |
          uv run python scripts/localnet_replay_corpus.py \
            --corpus "$XIAN_REPLAY_CORPUS" --image xian-replay:local \
            --output .artifacts/architecture-replay
      - name: Check published application workflows in the same native image
        working-directory: xian-stack
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.replay_run_id || github.run_id }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          compatibility_dir="$GITHUB_WORKSPACE/xian-contracting/tests/compatibility"
          application_output="$PWD/.artifacts/architecture-applications"
          mkdir -p "$application_output"
          printf '%s\n' "$SOURCE_RUN_ID" > "$application_output/source-run-id.txt"
          printf '%s\n' "$WORKFLOW_REVISION" > "$application_output/workflow-revision.txt"
          replay_image=$(docker image inspect --format '{{.Id}}' xian-replay:local)
          printf '%s\n' "$replay_image" > "$application_output/image-id.txt"
          git -C ../xian-contracting rev-parse HEAD > "$application_output/runtime-source-revision.txt"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none --read-only \
            --cpus 2 --memory 1g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m --env HOME=/tmp \
            --mount "type=bind,src=$compatibility_dir/application_runner.py,dst=/corpus/application_runner.py,readonly" \
            --mount "type=bind,src=$compatibility_dir/application_expectations.py,dst=/corpus/application_expectations.py,readonly" \
            --mount "type=bind,src=$compatibility_dir/runner.py,dst=/corpus/runner.py,readonly" \
            --mount "type=bind,src=$compatibility_dir/applications,dst=/corpus/applications,readonly" \
            --mount "type=bind,src=$application_output,dst=/output" \
            --entrypoint /usr/local/bin/python3 "$replay_image" \
            /corpus/application_runner.py --engine native-metered --check \
            --output /output/native-metered.json \
            > "$application_output/native-metered.log" 2>&1
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.runner }}
          path: |
            xian-stack/.artifacts/architecture-replay/result.json
            replay-transport-proof.json
            xian-stack/.artifacts/architecture-applications/native-metered.json
            xian-stack/.artifacts/architecture-applications/source-run-id.txt
            xian-stack/.artifacts/architecture-applications/workflow-revision.txt
            xian-stack/.artifacts/architecture-applications/image-id.txt
            xian-stack/.artifacts/architecture-applications/runtime-source-revision.txt
          if-no-files-found: warn
      - name: Upload ordinary replay diagnostics only
        if: ${{ always() && !inputs.replay_corpus_ref }}
        uses: actions/upload-artifact@v7
        with:
          name: replay-diagnostics-${{ matrix.runner }}
          path: |
            xian-stack/.artifacts/architecture-replay/container.log
            xian-stack/.artifacts/architecture-applications/native-metered.log
          if-no-files-found: warn
      - name: Remove private plaintext and raw replay diagnostics
        if: ${{ always() && inputs.replay_corpus_ref }}
        env:
          PRIVATE_CORPUS: ${{ runner.temp }}/xian-replay-private
          PRIVATE_REPLAY: ${{ github.workspace }}/xian-stack/.artifacts/architecture-replay
        run: |
          python3 - <<'PYCODE'
          import os, shutil
          from pathlib import Path
          shutil.rmtree(os.environ['PRIVATE_CORPUS'], ignore_errors=True)
          replay = Path(os.environ['PRIVATE_REPLAY'])
          for name in ('home', 'hooks'):
              shutil.rmtree(replay / name, ignore_errors=True)
          (replay / 'container.log').unlink(missing_ok=True)
          PYCODE
