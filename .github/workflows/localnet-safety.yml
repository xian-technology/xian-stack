name: Localnet Safety

on:
  workflow_dispatch:
    inputs:
      replay_run_id:
        description: 'Optional prior Localnet Safety run ID: replay its exact corpus without creating a new network'
        required: false
        type: string
  schedule:
    - cron: "17 2 * * *"

jobs:
  protocol-safety-localnet:
    if: ${{ !inputs.replay_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-abci
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Check out xian-cli
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-cli
          path: xian-cli

      - name: Use matching dependency branches when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for repo in xian-abci xian-contracting xian-py xian-configs xian-cli; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$BRANCH"
              git -C "$repo" checkout -B "$BRANCH" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run protocol safety localnet
        working-directory: xian-stack
        env:
          LOCALNET_PROTOCOL_SAFETY_BUILD: "1"
        run: make localnet-protocol-safety

      - name: Upload protocol safety artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xian-stack-protocol-safety-localnet
          path: |
            xian-stack/.artifacts/localnet-protocol-safety
            xian-stack/.localnet/network.json
          if-no-files-found: warn

  release-safety-localnet:
    if: ${{ !inputs.replay_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out xian-stack
        uses: actions/checkout@v7
        with:
          path: xian-stack

      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-abci
          path: xian-abci

      - name: Check out xian-contracting
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting

      - name: Check out xian-py
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-py
          path: xian-py

      - name: Check out xian-configs
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          path: xian-configs

      - name: Check out xian-cli
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-cli
          path: xian-cli

      - name: Check out xian-contracts
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracts
          path: xian-contracts

      - name: Check out canonical DEX bundle
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-dex
          ref: 3acf3414a79cf1558eacdb31e00328073d96020e
          path: xian-dex

      - name: Check out DEX recovery probe
        uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-dex-automation
          ref: 861364cd206c67afaa085d5427e5c4ad4fe28780
          path: xian-dex-automation

      - name: Use matching dependency branches when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for repo in xian-abci xian-contracting xian-py xian-configs xian-cli xian-contracts; do
            REMOTE="https://github.com/xian-technology/${repo}"
            if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
              git -C "$repo" fetch --depth=1 origin "$BRANCH"
              git -C "$repo" checkout -B "$BRANCH" FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Run release safety localnet
        working-directory: xian-stack
        run: ./scripts/release-safety.sh --skip-repo-validation --skip-protocol-safety

      - name: Upload localnet safety artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xian-stack-release-safety-localnet
          path: |
            xian-stack/.artifacts/localnet-e2e
            xian-stack/.localnet/network.json
          if-no-files-found: warn

      - name: Upload corpus for native architecture replay
        uses: actions/upload-artifact@v7
        with:
          name: xian-stack-replay-corpus
          include-hidden-files: true
          path: xian-stack/.artifacts/localnet-e2e/*/replay-corpus/
          if-no-files-found: error

  replay-architecture:
    name: Replay corpus (${{ matrix.runner }})
    needs: release-safety-localnet
    if: ${{ always() && !cancelled() && (needs.release-safety-localnet.result == 'success' || inputs.replay_run_id != '') }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Validate the source workflow run
        env:
          SOURCE_RUN_ID: ${{ inputs.replay_run_id || github.run_id }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['SOURCE_RUN_ID']), 'invalid source run ID'
          PYCODE
      - name: Download the same source-network corpus
        uses: actions/download-artifact@v8
        with:
          name: xian-stack-replay-corpus
          path: corpus
          run-id: ${{ inputs.replay_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Read exact source revisions
        id: corpus
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          manifests = list(Path('corpus').rglob('manifest.json'))
          assert len(manifests) == 1, manifests
          manifest = json.loads(manifests[0].read_text())
          assert not manifest.get('dirty_repositories'), 'CI replay requires committed source revisions'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('path=' + str(manifests[0].parent.resolve()), file=output)
              for repo, sha in manifest['repositories'].items():
                  assert re.fullmatch(r'[0-9a-f]{40}', sha), (repo, sha)
                  print(repo.replace('-', '_') + '=' + sha, file=output)
          PY

      - uses: actions/checkout@v7
        with:
          path: xian-stack
          ref: ${{ steps.corpus.outputs.xian_stack }}
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-abci
          path: xian-abci
          ref: ${{ steps.corpus.outputs.xian_abci }}
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-contracting
          path: xian-contracting
          ref: ${{ steps.corpus.outputs.xian_contracting }}
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-py
          path: xian-py
          ref: ${{ steps.corpus.outputs.xian_py }}
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          path: xian-configs
          ref: ${{ steps.corpus.outputs.xian_configs }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Build a native node from the recorded revisions
        run: |
          docker buildx build --load --target integrated \
            --build-context xian-abci=./xian-abci \
            --build-context xian-contracting=./xian-contracting \
            --build-context xian-py=./xian-py \
            --build-context xian-configs=./xian-configs \
            --tag xian-replay:local --file xian-stack/docker/xian-node.Dockerfile xian-stack
      - name: Re-execute every source block and compare outcomes
        working-directory: xian-stack
        env:
          XIAN_REPLAY_CORPUS: ${{ steps.corpus.outputs.path }}
        run: |
          uv run python scripts/localnet_replay_corpus.py \
            --corpus "$XIAN_REPLAY_CORPUS" --image xian-replay:local \
            --output .artifacts/architecture-replay
      - name: Check published application workflows in the same native image
        working-directory: xian-stack
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.replay_run_id || github.run_id }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          compatibility_dir="$GITHUB_WORKSPACE/xian-contracting/tests/compatibility"
          application_output="$PWD/.artifacts/architecture-applications"
          mkdir -p "$application_output"
          printf '%s\n' "$SOURCE_RUN_ID" > "$application_output/source-run-id.txt"
          printf '%s\n' "$WORKFLOW_REVISION" > "$application_output/workflow-revision.txt"
          replay_image=$(docker image inspect --format '{{.Id}}' xian-replay:local)
          printf '%s\n' "$replay_image" > "$application_output/image-id.txt"
          git -C ../xian-contracting rev-parse HEAD > "$application_output/runtime-source-revision.txt"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none --read-only \
            --cpus 2 --memory 1g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m --env HOME=/tmp \
            --mount "type=bind,src=$compatibility_dir/application_runner.py,dst=/corpus/application_runner.py,readonly" \
            --mount "type=bind,src=$compatibility_dir/application_expectations.py,dst=/corpus/application_expectations.py,readonly" \
            --mount "type=bind,src=$compatibility_dir/runner.py,dst=/corpus/runner.py,readonly" \
            --mount "type=bind,src=$compatibility_dir/applications,dst=/corpus/applications,readonly" \
            --mount "type=bind,src=$application_output,dst=/output" \
            --entrypoint /usr/local/bin/python3 "$replay_image" \
            /corpus/application_runner.py --engine native-metered --check \
            --output /output/native-metered.json \
            > "$application_output/native-metered.log" 2>&1
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.runner }}
          path: |
            xian-stack/.artifacts/architecture-replay/result.json
            xian-stack/.artifacts/architecture-replay/container.log
            xian-stack/.artifacts/architecture-applications
          if-no-files-found: warn
