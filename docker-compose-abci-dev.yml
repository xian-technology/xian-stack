x-logging: &x-logging
  driver: local
  options:
    max-size: "${XIAN_DOCKER_LOG_MAX_FILE_MB:-50}m"
    max-file: "${XIAN_DOCKER_LOG_MAX_FILES:-5}"
    mode: blocking

services:
  abci:
    logging: *x-logging
    hostname: xian-stack-dev
    build:
      context: .
      dockerfile: ./docker/xian-node.Dockerfile
      target: dev
      additional_contexts:
        xian-abci: ${XIAN_ABCI_DIR}
        xian-configs: ${XIAN_CONFIGS_DIR}
        xian-contracting: ${XIAN_CONTRACTING_DIR}
        xian-py: ${XIAN_PY_DIR}
      args:
        COMETBFT_VERSION: ${XIAN_COMETBFT_VERSION}
        S6_OVERLAY_VERSION: ${XIAN_S6_OVERLAY_VERSION}
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace/xian-abci
    volumes:
      - ${XIAN_ABCI_DIR}:/workspace/xian-abci
      - ${XIAN_CONFIGS_DIR}:/workspace/xian-configs
      - ${XIAN_CONTRACTING_DIR}:/workspace/xian-contracting
      - ${XIAN_PY_DIR}:/workspace/xian-py
      - ${XIAN_COMETBFT_HOME}:/root/.cometbft
    environment:
      XIAN_CONFIGS_DIR: /workspace/xian-configs
    networks:
      - xian-net
      - xian-db
    command: ["/bin/bash"]
