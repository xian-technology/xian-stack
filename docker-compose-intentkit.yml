x-logging: &x-logging
  driver: local
  options:
    max-size: "${XIAN_DOCKER_LOG_MAX_FILE_MB:-50}m"
    max-file: "${XIAN_DOCKER_LOG_MAX_FILES:-5}"
    mode: blocking

x-intentkit-xian-source-volumes: &intentkit-xian-source-volumes
  - ${XIAN_PY_DIR}:/xian-py:ro
  - ${XIAN_CONTRACTING_DIR}:/xian-contracting:ro

x-intentkit-xian-networks: &intentkit-xian-networks
  - default
  - xian-stack

networks:
  xian-stack:
    name: ${XIAN_STACK_DOCKER_NETWORK:-xian-stack_xian-net}
    external: true

services:
  api:
    logging: *x-logging
    build:
      context: ${XIAN_INTENTKIT_DIR}
      dockerfile: ${XIAN_INTENTKIT_STACK_DOCKERFILE}
      additional_contexts:
        xian_py: ${XIAN_PY_DIR}
        xian_contracting: ${XIAN_CONTRACTING_DIR}
      args:
        RELEASE: ${XIAN_INTENTKIT_RELEASE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *intentkit-xian-source-volumes
    networks: *intentkit-xian-networks
    ports:
      - target: 8000
        published: "${XIAN_INTENTKIT_API_PORT}"
        host_ip: "${XIAN_INTENTKIT_HOST}"
        protocol: tcp

  autonomous:
    logging: *x-logging
    build:
      context: ${XIAN_INTENTKIT_DIR}
      dockerfile: ${XIAN_INTENTKIT_STACK_DOCKERFILE}
      additional_contexts:
        xian_py: ${XIAN_PY_DIR}
        xian_contracting: ${XIAN_CONTRACTING_DIR}
      args:
        RELEASE: ${XIAN_INTENTKIT_RELEASE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *intentkit-xian-source-volumes
    networks: *intentkit-xian-networks

  scheduler:
    logging: *x-logging
    build:
      context: ${XIAN_INTENTKIT_DIR}
      dockerfile: ${XIAN_INTENTKIT_STACK_DOCKERFILE}
      additional_contexts:
        xian_py: ${XIAN_PY_DIR}
        xian_contracting: ${XIAN_CONTRACTING_DIR}
      args:
        RELEASE: ${XIAN_INTENTKIT_RELEASE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *intentkit-xian-source-volumes
    networks: *intentkit-xian-networks

  frontend:
    logging: *x-logging
    build:
      context: ${XIAN_INTENTKIT_DIR}/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://${XIAN_INTENTKIT_PUBLIC_HOST}:${XIAN_INTENTKIT_API_PORT}
        NEXT_PUBLIC_AWS_S3_CDN_URL: http://${XIAN_INTENTKIT_PUBLIC_HOST}:${XIAN_INTENTKIT_S3_PORT}/static
    ports:
      - target: 3000
        published: "${XIAN_INTENTKIT_PORT}"
        host_ip: "${XIAN_INTENTKIT_HOST}"
        protocol: tcp

  rustfs:
    logging: *x-logging
    ports:
      - target: 9000
        published: "${XIAN_INTENTKIT_S3_PORT}"
        host_ip: "${XIAN_INTENTKIT_HOST}"
        protocol: tcp

  # Retention applies to services inherited from the upstream composition too.
  db:
    logging: *x-logging
  caddy:
    logging: *x-logging
  redis:
    logging: *x-logging
  telegram:
    logging: *x-logging
  wechat:
    logging: *x-logging
