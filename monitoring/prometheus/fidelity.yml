global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/shared-network.yml

scrape_configs:
  - job_name: xian_abci
    static_configs:
      - targets:
          - abci-app:9108

  - job_name: xian_cometbft
    static_configs:
      - targets:
          - cometbft:26660
