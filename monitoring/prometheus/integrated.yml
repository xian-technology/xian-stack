global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/shared-network.yml
  - /etc/prometheus/rules/block-cadence.yml

scrape_configs:
  - job_name: xian_abci
    static_configs:
      - targets:
          - abci:9108

  - job_name: xian_cometbft
    static_configs:
      - targets:
          - abci:26660

  - job_name: xian_node
    static_configs:
      - targets:
          - node-exporter:9100
