global:
  resolve_timeout: 5m

route:
  receiver: xian-default
  group_by: ["alertname", "profile", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: xian-infra-critical
      matchers:
        - severity="critical"
    - receiver: xian-bds-recovery
      matchers:
        - alertname=~"XianBds.*"
    - receiver: xian-ops-warning
      matchers:
        - severity="warning"

receivers:
  - name: xian-default
  - name: xian-infra-critical
    webhook_configs:
      - url: http://127.0.0.1:9000/infra-critical
        send_resolved: true
  - name: xian-bds-recovery
    webhook_configs:
      - url: http://127.0.0.1:9000/bds-recovery
        send_resolved: true
  - name: xian-ops-warning
    webhook_configs:
      - url: http://127.0.0.1:9000/ops-warning
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname="XianAbciTargetDown"
    target_matchers:
      - alertname=~"XianBds.*|XianNodeInfoMissing"
    equal: ["instance", "profile"]
  # Without CometBFT metrics the peer, signing and stall alerts say nothing new.
  - source_matchers:
      - alertname="XianCometBftTargetDown"
    target_matchers:
      - alertname=~"XianNoPeers|XianPeersLow|XianValidator.*|XianBlockProductionStalled"
    equal: ["instance", "profile"]
  - source_matchers:
      - alertname="XianNoPeers"
    target_matchers:
      - alertname="XianPeersLow"
    equal: ["instance", "profile"]
  - source_matchers:
      - alertname="XianDiskSpaceCritical"
    target_matchers:
      - alertname=~"XianDiskSpaceLow|XianDiskFillingUp"
    equal: ["instance", "mountpoint"]
