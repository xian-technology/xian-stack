x-node-build: &x-node-build
  context: .
  dockerfile: ./docker/xian-node.Dockerfile
  additional_contexts:
    xian-abci: ${XIAN_ABCI_DIR}
    xian-configs: ${XIAN_CONFIGS_DIR}
    xian-contracting: ${XIAN_CONTRACTING_DIR}
    xian-py: ${XIAN_PY_DIR}
  args:
    COMETBFT_VERSION: ${XIAN_COMETBFT_VERSION}
    S6_OVERLAY_VERSION: ${XIAN_S6_OVERLAY_VERSION}

networks:
  xian-net:
    internal: false
  xian-db:
    internal: true

volumes:
  xian-abci-runtime-tmp:

# Shared RPC liveness probe for nodes that expose CometBFT's RPC on 26657.
# Used as a healthcheck so dependents can wait on service_healthy. Tries
# curl first (Debian-based images), falls back to wget (Alpine/busybox).
x-rpc-healthcheck: &x-rpc-healthcheck
  test:
    [
      "CMD-SHELL",
      "curl -sf http://127.0.0.1:26657/status >/dev/null 2>&1 || wget -qO- http://127.0.0.1:26657/status >/dev/null 2>&1 || exit 1",
    ]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  abci:
    profiles: ["integrated"]
    image: ${XIAN_NODE_INTEGRATED_IMAGE:-xian-node-integrated:local}
    restart: always
    stop_grace_period: 45s
    hostname: xian-stack
    build:
      <<: *x-node-build
      target: integrated
    mem_limit: ${XIAN_DOCKER_ABCI_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_ABCI_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_ABCI_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_ABCI_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_ABCI_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_ABCI_NOFILE_HARD}
    volumes:
      - ${XIAN_COMETBFT_HOME}:/root/.cometbft
    environment:
      XIAN_CONFIGS_DIR: /opt/xian-configs
      S6_VERBOSITY: ${XIAN_S6_VERBOSITY}
      XIAN_PERF_ENABLED: ${XIAN_PERF_ENABLED}
      XIAN_PERF_RECENT_BLOCKS: ${XIAN_PERF_RECENT_BLOCKS}
      XIAN_PERF_OUTPUT_PATH: /root/.cometbft/xian-perf.json
    stdin_open: true
    tty: true
    networks:
      - xian-net
      - xian-db
    ports:
      - "${XIAN_COMETBFT_RPC_HOST}:${XIAN_COMETBFT_RPC_PORT}:26657"
      - "${XIAN_COMETBFT_P2P_HOST}:${XIAN_COMETBFT_P2P_PORT}:26656"
      - "${XIAN_COMETBFT_METRICS_HOST}:${XIAN_COMETBFT_METRICS_PORT}:26660"
      - "${XIAN_APP_METRICS_HOST}:${XIAN_APP_METRICS_PORT}:9108"
    healthcheck: *x-rpc-healthcheck

  dashboard:
    profiles: ["dashboard-integrated"]
    image: ${XIAN_NODE_SPLIT_IMAGE:-xian-node-split:local}
    restart: always
    init: true
    stop_grace_period: 30s
    hostname: xian-stack-dashboard
    build:
      <<: *x-node-build
      target: split
    mem_limit: ${XIAN_DOCKER_DASHBOARD_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_DASHBOARD_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_DASHBOARD_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_DASHBOARD_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_DASHBOARD_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_DASHBOARD_NOFILE_HARD}
    depends_on:
      abci:
        condition: service_healthy
    command:
      [
        "xian-dashboard",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--rpc-url",
        "http://abci:26657",
      ]
    networks:
      - xian-net
    ports:
      - "${XIAN_DASHBOARD_HOST}:${XIAN_DASHBOARD_PORT}:8080"

  abci-app:
    profiles: ["fidelity"]
    image: ${XIAN_NODE_SPLIT_IMAGE:-xian-node-split:local}
    restart: always
    init: true
    stop_grace_period: 45s
    hostname: xian-stack-abci
    build:
      <<: *x-node-build
      target: split
    mem_limit: ${XIAN_DOCKER_FIDELITY_ABCI_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_FIDELITY_ABCI_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_FIDELITY_ABCI_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_FIDELITY_ABCI_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_FIDELITY_ABCI_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_FIDELITY_ABCI_NOFILE_HARD}
    volumes:
      - ${XIAN_COMETBFT_HOME}:/root/.cometbft
      - xian-abci-runtime-tmp:/tmp
    environment:
      XIAN_CONFIGS_DIR: /opt/xian-configs
      XIAN_PERF_ENABLED: ${XIAN_PERF_ENABLED}
      XIAN_PERF_RECENT_BLOCKS: ${XIAN_PERF_RECENT_BLOCKS}
      XIAN_PERF_OUTPUT_PATH: /root/.cometbft/xian-perf.json
    stdin_open: true
    tty: true
    command: ["xian-abci"]
    networks:
      - xian-net
      - xian-db
    ports:
      - "${XIAN_APP_METRICS_HOST}:${XIAN_APP_METRICS_PORT}:9108"

  cometbft:
    profiles: ["fidelity"]
    image: ${XIAN_NODE_SPLIT_IMAGE:-xian-node-split:local}
    restart: always
    init: true
    stop_grace_period: 45s
    hostname: xian-stack-cometbft
    build:
      <<: *x-node-build
      target: split
    mem_limit: ${XIAN_DOCKER_FIDELITY_COMETBFT_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_FIDELITY_COMETBFT_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_FIDELITY_COMETBFT_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_FIDELITY_COMETBFT_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_FIDELITY_COMETBFT_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_FIDELITY_COMETBFT_NOFILE_HARD}
    volumes:
      - ${XIAN_COMETBFT_HOME}:/root/.cometbft
      - xian-abci-runtime-tmp:/tmp
    stdin_open: true
    tty: true
    command: ["cometbft", "node", "--rpc.laddr", "tcp://0.0.0.0:26657"]
    networks:
      - xian-net
    ports:
      - "${XIAN_COMETBFT_RPC_HOST}:${XIAN_COMETBFT_RPC_PORT}:26657"
      - "${XIAN_COMETBFT_P2P_HOST}:${XIAN_COMETBFT_P2P_PORT}:26656"
      - "${XIAN_COMETBFT_METRICS_HOST}:${XIAN_COMETBFT_METRICS_PORT}:26660"
    healthcheck: *x-rpc-healthcheck

  dashboard-fidelity:
    profiles: ["dashboard-fidelity"]
    image: ${XIAN_NODE_SPLIT_IMAGE:-xian-node-split:local}
    restart: always
    init: true
    stop_grace_period: 30s
    hostname: xian-stack-dashboard
    build:
      <<: *x-node-build
      target: split
    mem_limit: ${XIAN_DOCKER_DASHBOARD_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_DASHBOARD_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_DASHBOARD_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_DASHBOARD_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_DASHBOARD_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_DASHBOARD_NOFILE_HARD}
    depends_on:
      cometbft:
        condition: service_healthy
    command:
      [
        "xian-dashboard",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--rpc-url",
        "http://cometbft:26657",
      ]
    networks:
      - xian-net
    ports:
      - "${XIAN_DASHBOARD_HOST}:${XIAN_DASHBOARD_PORT}:8080"
