networks:
  xian-net:
    internal: false  # Allow internet access for package installation
  xian-db:
    internal: true   # Keep database isolated

services:
  abci:
    restart: always
    init: true
    stop_grace_period: 45s
    hostname: xian-stack
    build:
      context: .
      dockerfile: ./docker/abci.Dockerfile
    mem_limit: ${XIAN_DOCKER_ABCI_MEMORY_LIMIT}
    mem_reservation: ${XIAN_DOCKER_ABCI_MEMORY_RESERVATION}
    memswap_limit: ${XIAN_DOCKER_ABCI_MEMORY_SWAP}
    pids_limit: ${XIAN_DOCKER_ABCI_PIDS_LIMIT}
    ulimits:
      nofile:
        soft: ${XIAN_DOCKER_ABCI_NOFILE_SOFT}
        hard: ${XIAN_DOCKER_ABCI_NOFILE_HARD}
    volumes:
      - ${XIAN_ABCI_DIR}:/usr/src/app/xian-abci
      - ${XIAN_CONFIGS_DIR}:/usr/src/app/xian-configs
      - ${XIAN_CONTRACTING_DIR}:/usr/src/app/xian-contracting
      - ${XIAN_PY_DIR}:/usr/src/app/xian-py
      - ${XIAN_COMETBFT_HOME}:/root/.cometbft
    environment:
      XIAN_CONFIGS_DIR: /usr/src/app/xian-configs
    stdin_open: true
    tty: true
    networks:
      - xian-net
      - xian-db
    ports:
      - "26657:26657"
      - "26656:26656"
      - "26660:26660"
    command: >
      bash -lc "pip install -e ./xian-py && pip install -e ./xian-contracting && pip install -e ./xian-abci && tail -f /dev/null"
